[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ["dependencies"]
solc = "0.8.27"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
match_path = "test/**/*.t.sol"
fs_permissions = [{ access = "read-write", path = "./" }]

# Local scripts profile - use with FOUNDRY_PROFILE=local
[profile.local]
eth_rpc_url = "http://127.0.0.1:8545"

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
bracket_spacing = true
int_types = "long"

[lint]
exclude_lints = ["mixed-case-variable"]

[dependencies]
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"
forge-std = "1.11.0"
aztec-contracts = { version = "4.0.0", git = "https://github.com/AztecProtocol/l1-contracts.git", branch = "rc" }
"@layerzerolabs-oapp-evm" = "0.4.1"
"@layerzerolabs-oft-evm" = "4.0.1"
"@layerzerolabs-lz-evm-protocol-v2" = "3.0.160"
"@layerzerolabs-lz-evm-messagelib-v2" = "3.0.160"
"@layerzerolabs-lz-evm-v1-0-7" = "3.0.160"
"@layerzerolabs-test-devtools-evm-foundry" = "8.0.1"
solidity-bytes-utils = { version = "0.8.2", git = "https://github.com/GNSPS/solidity-bytes-utils.git", tag = "v0.8.2" }

[soldeer]
remappings_generate = false

# See more config options https://book.getfoundry.sh/reference/config/overview
[invariant]
runs = 8
depth = 8

# Stress profile, more and deeper runs
[profile.stress.invariant]
runs = 1000
depth = 256
fail_on_revert = true
dictionary_weight = 80
include_storage = true
include_push_bytes = true

# CI profile - dynamic_test_linking only compiles test files needed per job,
# avoiding OOM from compiling all 182 files with via_ir on standard runners.
[profile.ci]
dynamic_test_linking = true

[profile.ci.invariant]
runs = 256
depth = 256

# Dev build profile - only protocol contracts and mocks (no test files)
[profile.dev]
src = 'src'
test = 'test/mocks'
script = 'script'
