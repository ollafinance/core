[profile.default]
src = 'src'
test = 'test'
script = 'script'
out = 'out'
libs = ["dependencies"]
solc = "0.8.27"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
match_path = "test/**/*.t.sol"
fs_permissions = [{ access = "read-write", path = "./" }]

# Local scripts profile - use with FOUNDRY_PROFILE=local
[profile.local]
eth_rpc_url = "http://127.0.0.1:8545"


[rpc_endpoints]
default_network = "http://127.0.0.1:8545"

mainnet = "https://eth-mainnet.alchemyapi.io/v2/${ALCHEMY_API_KEY}"
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
arbitrumSepolia = "https://arb-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
optimism = "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
optimismSepolia = "https://opt-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
polygon = "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
polygonMumbai = "https://polygon-mumbai.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
polygonZkEvm = "https://zkevm-rpc.com"
polygonZkEvmTestnet = "https://rpc.public.zkevm-test.net"
gnosis = "https://rpc.gnosischain.com"
chiado = "https://rpc.chiadochain.net"
base = "https://mainnet.base.org"
baseSepolia = "https://sepolia.base.org"
scrollSepolia = "https://sepolia-rpc.scroll.io"
scroll = "https://rpc.scroll.io"
pgn = "https://rpc.publicgoods.network"
pgnTestnet = "https://sepolia.publicgoods.network"


localhost = "http://127.0.0.1:8545"

[etherscan]
polygonMumbai = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }


[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
bracket_spacing = true
int_types = "long"

[lint]
exclude_lints = ["mixed-case-variable"]

[dependencies]
"@openzeppelin-contracts" = "5.5.0"
"@openzeppelin-contracts-upgradeable" = "5.5.0"
forge-std = "1.11.0"
aztec-contracts = { version = "4.0.0", git = "https://github.com/AztecProtocol/l1-contracts.git", branch = "rc" }
"@layerzerolabs-oapp-evm" = "0.4.1"
"@layerzerolabs-oft-evm" = "4.0.1"
"@layerzerolabs-lz-evm-protocol-v2" = "3.0.160"
"@layerzerolabs-lz-evm-messagelib-v2" = "3.0.160"
"@layerzerolabs-lz-evm-v1-0-7" = "3.0.160"
"@layerzerolabs-test-devtools-evm-foundry" = "8.0.1"
solidity-bytes-utils = { version = "0.8.2", git = "https://github.com/GNSPS/solidity-bytes-utils.git", tag = "v0.8.2" }

[soldeer]
remappings_generate = false

# See more config options https://book.getfoundry.sh/reference/config/overview
[invariant]
runs = 8
depth = 8

# CI profile - dynamic_test_linking only compiles test files needed per job,
# avoiding OOM from compiling all 182 files with via_ir on standard runners.
[profile.ci]
dynamic_test_linking = true

[profile.ci.invariant]
runs = 256
depth = 256

# Dev build profile - only protocol contracts and mocks (no test files)
[profile.dev]
src = 'src'
test = 'test/mocks'
script = 'script'
