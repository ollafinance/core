name: Setup Forge CI
description: Setup Forge, dependencies, cache, and compile contracts
inputs:
  workdir:
    description: Working directory for Forge
    default: contracts
  cache-prefix:
    description: Prefix for Forge output cache key
    default: forge-out
  compile-contracts:
    description: Compile contracts
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: v1.4.1

    - name: Setup Soldeer dependencies
      uses: ./.github/actions/setup-soldeer
      with:
        workdir: ${{ inputs.workdir }}

    - name: Cache Forge build artifacts
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.workdir }}/out
          ${{ inputs.workdir }}/cache
        key: ${{ runner.os }}-${{ inputs.cache-prefix }}-${{ hashFiles(format('{0}/src/**/*.sol', inputs.workdir), format('{0}/foundry.toml', inputs.workdir), format('{0}/soldeer.lock', inputs.workdir)) }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-prefix }}-

    - name: Compile contracts (ci profile, exclude tests)
      if: ${{ inputs.compile-contracts == 'true' }}
      run: FOUNDRY_PROFILE=ci forge build src
      shell: bash
      working-directory: ${{ inputs.workdir }}
