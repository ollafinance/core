name: Storage Layout

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main

jobs:
  storage-layout:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft
      == false }}
    name: check storage layout
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Forge CI
        uses: ./.github/actions/setup-foundry-ci
        with:
          workdir: contracts
          cache-prefix: forge-out-storage
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check storage layouts
        run: |
          npx tsx script/check-storage-layout.ts --contract OllaCore --fixture upgrade/fixtures/OllaCore.storage.json
          npx tsx script/check-storage-layout.ts --contract OllaVault --fixture upgrade/fixtures/OllaVault.storage.json
          npx tsx script/check-storage-layout.ts --contract RewardsAccumulator --fixture upgrade/fixtures/RewardsAccumulator.storage.json
          npx tsx script/check-storage-layout.ts --contract StakingManager --fixture upgrade/fixtures/StakingManager.storage.json
          npx tsx script/check-storage-layout.ts --contract StakingProviderRegistry --fixture upgrade/fixtures/StakingProviderRegistry.storage.json
          npx tsx script/check-storage-layout.ts --contract OllaGovernance --fixture upgrade/fixtures/OllaGovernance.storage.json
