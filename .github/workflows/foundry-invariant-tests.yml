name: Foundry Invariant Tests

on:
  pull_request:
    branches:
      - main

jobs:
  invariant:
    name: Forge invariant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Forge invariant tests
        run: forge test --match-path "test/**/*.invariant.sol" --invariant-runs 256 --invariant-depth 256
