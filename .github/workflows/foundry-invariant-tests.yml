name: Foundry Invariant Tests

on:
  pull_request:
    branches:
      - main

jobs:
  invariant:
    name: Forge invariant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Setup Soldeer dependencies
        uses: ./.github/actions/setup-soldeer
      - name: Forge clean
        run: forge clean
      - name: Forge invariant tests
        run: forge test --match-path "test/**/*.invariant.sol"
        env:
          FOUNDRY_PROFILE: ci
