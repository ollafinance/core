name: Foundry Invariant Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

jobs:
  invariant:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Forge invariant tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Setup Soldeer dependencies
        uses: ./.github/actions/setup-soldeer
      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: contracts/out
          key: ${{ runner.os }}-forge-out-${{ hashFiles('contracts/src/**/*.sol', 'contracts/test/**/*.sol', 'contracts/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-forge-out-
      - name: Forge invariant tests
        run: forge test --match-path "test/**/*.invariant.t.sol"
        env:
          FOUNDRY_PROFILE: ci
