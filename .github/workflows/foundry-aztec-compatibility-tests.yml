name: Foundry Aztec Compatibility Tests

on:
  pull_request:
    branches:
      - main

jobs:
  compatibility:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Forge Aztec compatibility tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Setup Soldeer dependencies
        uses: ./.github/actions/setup-soldeer
      - name: Forge Aztec compatibility tests
        run: forge test --match-path "test/integration/AztecInterfaceCompatibility.integration.t.sol"
