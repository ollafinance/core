name: Forge Aztec Compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - pashov-audit-fixes

jobs:
  compatibility:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: test aztec-compat
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Forge CI
        uses: ./.github/actions/setup-foundry-ci
        with:
          workdir: contracts
          cache-prefix: forge-out-aztec-compat
      - name: Forge Aztec compatibility tests
        run: forge test --match-path "test/integration/AztecInterfaceCompatibility.integration.t.sol"
        env:
          FOUNDRY_PROFILE: ci
