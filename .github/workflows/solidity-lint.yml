name: Solidity Lint

on:
  pull_request:
    branches:
      - main

jobs:
  solhint:
    name: Solhint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Forge fmt check
        run: forge fmt --check
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
        working-directory: .
      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .
      - name: Run solhint
        run: yarn -s lint:sol
        working-directory: .
