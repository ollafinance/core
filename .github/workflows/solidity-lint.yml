name: Solidity Lint

on:
  pull_request:
    branches:
      - main

jobs:
  solhint:
    name: Solhint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check for Solidity files
        id: sol-files
        run: |
          if find contracts/src contracts/test contracts/script -type f -name "*.sol" -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Forge fmt check
        if: steps.sol-files.outputs.found == 'true'
        run: forge fmt --check
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
        working-directory: .
      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .
      - name: Run solhint
        if: steps.sol-files.outputs.found == 'true'
        run: yarn lint
        working-directory: .
      - name: Skip lint (no Solidity files)
        if: steps.sol-files.outputs.found != 'true'
        run: echo "No Solidity files found; skipping lint and fmt."
