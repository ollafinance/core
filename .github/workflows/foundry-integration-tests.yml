name: Foundry Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

jobs:
  integration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Forge integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Foundry CI
        uses: ./.github/actions/setup-foundry-ci
        with:
          workdir: contracts
          cache-prefix: forge-out-integration
      - name: Forge integration tests
        run: forge test --match-path "test/integration/**/*.t.sol"
        env:
          FOUNDRY_PROFILE: ci
