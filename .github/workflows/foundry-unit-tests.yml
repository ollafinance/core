name: Foundry Unit Tests

on:
  pull_request:
    branches:
      - main

jobs:
  unit:
    name: Forge unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Setup Soldeer dependencies
        uses: ./.github/actions/setup-soldeer
      - name: Forge clean
        run: forge clean
      - name: Forge unit tests
        run: forge test --match-path "test/**/*.t.sol" --no-match-path "test/**/*.integration.sol"
