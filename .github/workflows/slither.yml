name: Slither Analysis

on:
  pull_request:
    branches:
      - main

jobs:
  slither:
    name: Slither and Slytherin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Slither, Slytherin, and solc-select
        run: pip install slither-analyzer slytherin solc-select
      - name: Install solc
        run: |
          solc-select install 0.8.24
          solc-select use 0.8.24
      - name: Run Slither
        run: slither . --config-file slither.config.json
      - name: Run Slytherin
        run: slytherin .
