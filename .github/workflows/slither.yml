name: Slither Analysis

on:
  pull_request:
    branches:
      - main

jobs:
  slither:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Slither and Slytherin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-slither-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-slither-
      - name: Build Slither Docker image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            -f Dockerfile.slither \
            -t olla-slither:ci \
            .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - name: Run Slither (Docker)
        run: docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work olla-slither:ci slither . --config-file slither.config.json
