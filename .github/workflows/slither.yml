name: Slither Analysis

on:
  pull_request:
    branches:
      - main

jobs:
  slither:
    name: Slither and Slytherin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Slither, Slitherin, and solc-select
        run: pip install slither-analyzer==0.11.4 slitherin==0.7.2 solc-select
      - name: Patch Slitherin nft_approve_warning for LibraryCall
        run: |
          python - <<'PY'
          import inspect
          import os
          import re
          import slitherin

          path = os.path.join(os.path.dirname(inspect.getfile(slitherin)), "detectors", "nft_approve_warning.py")
          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          pattern = re.compile(
              r"""\n(\s*for f_called in f\.library_calls:\n\s*# Slither >=0\.11\.4 returns LibraryCall objects\n)(\s*if hasattr\(f_called, \\\"solidity_signature\\\"\):\n\s*all_library_calls\.append\(f_called\.solidity_signature\)\n\s*else:\n\s*# Older Slither returns tuples\n\s*all_library_calls\.append\(f_called\[1\]\.solidity_signature\)\n)"""
          )

          replacement = (
              "\\1"
              "            if hasattr(f_called, \\\"function\\\") and hasattr(f_called.function, \\\"solidity_signature\\\"):\n"
              "                all_library_calls.append(f_called.function.solidity_signature)\n"
              "            elif hasattr(f_called, \\\"solidity_signature\\\"):\n"
              "                all_library_calls.append(f_called.solidity_signature)\n"
              "            else:\n"
              "                # Older Slither returns tuples\n"
              "                all_library_calls.append(f_called[1].solidity_signature)\n"
          )

          new_src, count = pattern.subn(replacement, src)
          if count == 0:
              raise SystemExit("Expected Slitherin snippet not found; check slitherin version.")

          src = new_src
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("Patched", path)
          PY
      - name: Install solc
        run: |
          solc-select install 0.8.27
          solc-select use 0.8.27
      - name: Run Slither
        run: slither . --config-file slither.config.json
