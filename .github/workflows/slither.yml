name: Slither Analysis

on:
  pull_request:
    branches:
      - main

jobs:
  slither:
    name: Slither and Slytherin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Slither, Slitherin, and solc-select
        run: pip install slither-analyzer==0.11.4 slitherin==0.7.2 solc-select
      - name: Install solc
        run: |
          solc-select install 0.8.27
          solc-select use 0.8.27
      - name: Run Slither
        run: slither . --config-file slither.config.json
