name: Slither Analysis

on:
  pull_request:
    branches:
      - main

jobs:
  slither:
    name: Slither and Slytherin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Slither, Slitherin, and solc-select
        run: pip install slither-analyzer==0.11.4 slitherin==0.7.2 solc-select
      - name: Patch Slitherin nft_approve_warning for LibraryCall
        run: |
          python - <<'PY'
          import inspect
          import os
          import re
          import slitherin

          path = os.path.join(os.path.dirname(inspect.getfile(slitherin)), "detectors", "nft_approve_warning.py")
          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          lines = src.splitlines()
          patched = False
          for i, line in enumerate(lines):
              if "for f_called in f.library_calls:" in line:
                  indent = re.match(r"\s*", line).group(0)
                  start = i
                  end = i + 1
                  while end < len(lines):
                      if lines[end].strip() == "":
                          end += 1
                          continue
                      if not lines[end].startswith(indent + "    "):
                          break
                      end += 1

                  new_block = [
                      f"{indent}for f_called in f.library_calls:",
                      f"{indent}    # Slither >=0.11.4 returns LibraryCall objects",
                      f"{indent}    if hasattr(f_called, \"function\") and hasattr(f_called.function, \"solidity_signature\"):",
                      f"{indent}        all_library_calls.append(f_called.function.solidity_signature)",
                      f"{indent}    elif hasattr(f_called, \"solidity_signature\"):",
                      f"{indent}        all_library_calls.append(f_called.solidity_signature)",
                      f"{indent}    else:",
                      f"{indent}        # Older Slither returns tuples",
                      f"{indent}        all_library_calls.append(f_called[1].solidity_signature)",
                  ]

                  lines = lines[:start] + new_block + lines[end:]
                  patched = True
                  break

          if not patched:
              raise SystemExit("Expected Slitherin library_calls loop not found; check slitherin version.")

          src = "\n".join(lines) + "\n"
          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("Patched", path)
          PY
      - name: Install solc
        run: |
          solc-select install 0.8.27
          solc-select use 0.8.27
      - name: Run Slither
        run: slither . --config-file slither.config.json
